<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md overflow-x-hidden">
<!-- Login Screen -->
<main class="flex-grow flex items-center justify-center p-container-padding-mobile md:p-container-padding-desktop">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_2px_8px_rgba(69,90,100,0.08)] overflow-hidden flex flex-col items-center p-xl md:p-lg relative">
<!-- Branding Header -->
<div class="flex flex-col items-center mb-xl w-full">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-md shadow-md">
<span class="material-symbols-outlined text-on-primary-container text-[32px]">school</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">
                    Welcome Back
                </h1>
<p class="text-on-surface-variant font-body-lg text-body-lg text-center">
                    Enter your credentials to access the Attendance Manager
                </p>
</div>
<!-- Login Form -->
<form class="w-full space-y-lg" onsubmit="return false;">
<!-- Email Input Field -->
<div class="relative group">
<div class="flex items-center border border-outline rounded-lg px-md py-md group-focus-within:border-primary group-focus-within:border-2 transition-all">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary mr-md">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-on-surface placeholder:text-on-surface-variant/50 font-body-lg text-body-lg" placeholder="Email Address" required="" type="email"/>
</div>
</div>
<!-- Password Input Field -->
<div class="relative group">
<div class="flex items-center border border-outline rounded-lg px-md py-md group-focus-within:border-primary group-focus-within:border-2 transition-all">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary mr-md">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-on-surface placeholder:text-on-surface-variant/50 font-body-lg text-body-lg" placeholder="Password" required="" type="password"/>
<button class="ml-sm text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Actions: Forgot Password -->
<div class="flex justify-end items-center">
<a class="text-primary font-label-lg text-label-lg hover:underline transition-all" href="#">
                        Forgot Password?
                    </a>
</div>
<!-- Login Button -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-md rounded-full shadow-md hover:bg-primary-container active:scale-95 transition-all flex items-center justify-center gap-md" type="submit">
<span>Login</span>
<span class="material-symbols-outlined">login</span>
</button>
</form>
<!-- Bottom Action: Create Account -->
<div class="mt-xl flex flex-col items-center gap-sm">
<div class="h-px w-3/4 bg-outline-variant opacity-30"></div>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account?
                    <a class="text-primary font-title-lg text-title-lg font-bold ml-xs hover:underline" href="#">
                        Create Account
                    </a>
</p>
</div>
<!-- Background Decorative Element -->
<div class="absolute -bottom-16 -right-16 w-32 h-32 bg-secondary-fixed opacity-10 rounded-full blur-3xl -z-10"></div>
<div class="absolute -top-16 -left-16 w-48 h-48 bg-primary-fixed opacity-10 rounded-full blur-3xl -z-10"></div>
</div>
</main>
<!-- Footer Decoration -->
<footer class="p-lg text-center text-on-surface-variant font-label-md text-label-md opacity-60">
<p>© 2024 Hajar Attendance Manager. All rights reserved.</p>
</footer>
</body></html>
