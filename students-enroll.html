<!DOCTYPE html>
<html class="light" lang="en" style="">

<head>

    <!-- PWA Meta Tags -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d631b">

    <title>Student Enrollment</title>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                tailwind.config = {
                    darkMode: "class",
                    theme: {
                        extend: {
                            "colors": {
                                "secondary-fixed": "#6ffbbe",
                                "on-primary-fixed": "#0f0069",
                                "surface-container-low": "#eff4ff",

                                "on-tertiary": "#ffffff",

                                "surface-variant": "#d3e4fe",
                                "on-surface": "#0b1c30",

                                "on-surface-variant": "#464555",
                                "surface-container-lowest": "#ffffff",
                                "on-tertiary-fixed": "#40000d",
                                "surface-bright": "#f8f9ff",
                                "primary-container": "#006c49",
                                "inverse-primary": "#c3c0ff",
                                "tertiary-fixed-dim": "#ffb2b7",

                                "secondary": "#006c49",

                                "tertiary-fixed": "#ffdadb",
                                "surface-tint": "#006c49",
                                "on-tertiary-fixed-variant": "#92002a",
                                "surface-dim": "#cbdbf5",
                                "tertiary": "#95002b",
                                "surface-container-high": "#dce9ff",
                                "secondary-fixed-dim": "#4edea3",
                                "primary": "#006c49",
                                "primary-fixed-dim": "#c3c0ff",
                                "on-error": "#ffffff",
                                "on-background": "#0b1c30",
                                "surface": "#f8f9ff",
                                "on-secondary-fixed-variant": "#005236",
                                "inverse-surface": "#213145",
                                "error-container": "#ffdad6",
                                "on-secondary-fixed": "#002113",
                                "on-error-container": "#93000a",
                                "primary-fixed": "#e2dfff",
                                "on-tertiary-container": "#ffd0d2",
                                "surface-container": "#e5eeff",
                                "on-secondary-container": "#00714d"
                            },
                            "borderRadius": {
                                "DEFAULT": "0.25rem",
                                "lg": "0.5rem",
                                "xl": "0.75rem",
                                "full": "9999px"

                            "spacing": {
                                "container-padding": "1.25rem",
                                "section-margin": "2rem",
                                "gutter": "1rem",
                                "touch-target-min": "48px",
                                "stack-gap": "1rem"
                            },
                            "fontFamily": {
                                "headline-lg": ["Inter"],
                                "body-md": ["Inter"],
                                "headline-md": ["Inter"],

                                "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                                "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                                "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                                "stat-number": ["28px", { "lineHeight": "32px", "fontWeight": "700" }],

                        },
                    },
                }
            } catch (_e) { }
        } catch (_e) { }</script>

</head>

<body class="bg-background font-body-md text-on-background min-h-screen pb-48">
    <!-- Top App Bar -->
    <header
        class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface/80 shadow-sm flex items-center justify-between px-container-padding h-touch-target-min">
        <div class="flex items-center gap-3">
            <button
                class="transition-all duration-300 ease-in-out active:scale-95 text-on-surface-variant hover:bg-surface-container-highest/50 p-2 rounded-full">
                <span class="material-symbols-outlined" data-original-icon="arrow_back">arrow_back</span>
            </button>
            <h1 class="font-headline-md text-headline-md font-bold text-secondary">Student Enrollment</h1>
        </div>
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary" data-original-icon="notifications">notifications</span>
            <div
                class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container overflow-hidden">
                <img alt="Profile" class="w-full h-full object-cover"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAMZT8hZmXD4ZZtZZWXZprulC8-tayF2LeID9qx-BWYzfDIglUCRfeDT2vOd4qDz4sOLLNST4UNCdzsnYvu_xD3h5y6bTDFzvlLKtzxI8Ut6Awe60OvQzZ3TGNhriyePkbGSLiXJtRKw-0bGhLfOJdntggmi0EnXxWYZkNMDkPS3L6lnr9CHvfeOTothW4RKKVK-ZjJb2j1ulkT4m86aVKA9uVFTwJIHxj2dCeTqe5qEcbJKCSjGgdcTI1j_yl8C6dn2NAZric7qHA">
            </div>
        </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="pt-16 px-container-padding max-w-4xl mx-auto space-y-4">
        <!-- Compact Layout: Two-column grid on larger screens -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

            <form id="js-enrollment-form">
                <!-- Section: Personal Information -->
                <section class="rounded-xl p-4 border border-outline-variant/20 bg-surface-container-low shadow-sm">
                    <div class="flex items-center gap-2 mb-4 border-b border-outline-variant/10 pb-2">
                        <span class="material-symbols-outlined text-secondary text-xl">person</span>
                        <h2 class="font-headline-md text-base font-bold text-on-surface">Personal Information</h2>
                    </div>
                    <div class="space-y-3">
                        <div class="flex gap-4 items-center mb-2">
                            <div
                                class="relative w-20 h-20 rounded-lg bg-surface-container-lowest border border-dashed border-outline-variant flex flex-col items-center justify-center text-primary group cursor-pointer hover:border-primary shrink-0 overflow-hidden">
                                <span class="material-symbols-outlined text-xl">add_a_photo</span>
                                <span class="text-[10px] font-bold">PHOTO</span>
                                <input class="absolute inset-0 opacity-0 cursor-pointer" type="file" name="photo"
                                    id="photoInput">
                            </div>
                            <div class="flex-1 space-y-3">
                                <div class="relative group">
                                    <label
                                        class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">
                                        FULL NAME</label><input
                                        class="w-full h-10  px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all"
                                        placeholder="Full Name" type="text" name="name">
                                </div>
                                <div class="relative group"><label
                                        class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">PHONE</label><input
                                        class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all"
                                        placeholder="+91 9876543210" type="tel" name="phone"></div>
                            </div>
                        </div>

                        <div class="relative group"><label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">EMAIL</label><input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all"
                                placeholder="example@email.com" type="email" name="email"></div>
                    </div>
                </section>
                <!-- Section: Family Details -->
                <section class="rounded-xl p-4 border border-outline-variant/20 bg-surface-container-low shadow-sm">
                    <div class="flex items-center gap-2 mb-4 border-b border-outline-variant/10 pb-2">
                        <span class="material-symbols-outlined text-secondary text-xl">family_history</span>
                        <h2 class="font-headline-md text-base font-bold text-on-surface">Family Details</h2>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div class="relative group">
                            <label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">FATHER'S
                                NAME</label>
                            <input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all"
                                placeholder="Full Name" type="text" name="fatherName">
                        </div>
                        <div class="relative group">
                            <label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">MOTHER'S
                                NAME</label>
                            <input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all"
                                placeholder="Full Name" type="text" name="motherName">
                        </div>
                        <div class="relative group sm:col-span-2">
                            <label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">
                                CONTACT MOBILE</label>
                            <input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all"
                                placeholder="Whatsapp number" type="tel" name="fatherPhone">
                        </div>

                    </div>
                </section>
                <!-- Section: Address Details -->
                <section
                    class="rounded-xl p-4 border border-outline-variant/20 bg-surface-container-low shadow-sm lg:col-span-2">
                    <div class="flex items-center gap-2 mb-4 border-b border-outline-variant/10 pb-2">
                        <span class="material-symbols-outlined text-secondary text-xl">location_on</span>
                        <h2 class="font-headline-md text-base font-bold text-on-surface">Address Details</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                        <div class="relative group md:col-span-2">
                            <label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">RESIDENTIAL
                                ADDRESS</label>
                            <input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all"
                                placeholder="Street, Building No, Apartment..." type="text" name="address">
                        </div>
                        <div class="relative group"><label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">PLACE</label><input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all"
                                placeholder="Place" type="text" name="place"></div>
                        <div class="relative group"><label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">DISTRICT</label><input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all"
                                placeholder="District" type="text" name="district"></div>
                        <div class="relative group"><label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">STATE</label><input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all"
                                placeholder="State" type="text" name="State"></div>


                    </div>
                </section>
                <!-- Section: Academic Placement -->
                <section
                    class="rounded-xl p-4 border border-outline-variant/20 bg-surface-container-low shadow-sm lg:col-span-2">
                    <div class="flex items-center gap-2 mb-4 border-b border-outline-variant/10 pb-2">
                        <span class="material-symbols-outlined text-secondary text-xl">school</span>
                        <h2 class="font-headline-md text-base font-bold text-on-surface">Academic Placement</h2>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div class="relative group">
                            <label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">PREVIOUS COLLEGE
                                </label>
                            <input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-body-md"
                                 placeholder="College Name" type="text" name="previousCollege">
                        </div>
                        <div class="relative group">
                            <label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">RANK</label>
                            <select
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary outline-none appearance-none font-body-md" name="rank">
                                <option value="">Select Rank</option>
                                <option>Grade 1</option>
                                <option>Grade 2</option>
                                <option>Grade 3</option>
                            </select>
                            <span
                                class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
                        </div>
                        <div class="relative group">
                            <label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">CLASS</label>
                            <select
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary outline-none appearance-none font-body-md" name="class">
                                <option value="">Select Class</option>
                                <option value="plusone">plus one</option>
                                <option value="plustwo">plus two</option>
                                <option value="BS-1">BS-1</option>
                                <option value="BS-2">BS-2</option>
                                <option value="BS-3">BS-3</option>
                                <option value="BS-4">BS-4</option>
                            </select>
                            <span
                                class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
                        </div>
                        <div class="relative group">
                            <label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">ADMISSION
                                DATE</label>
                            <input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-body-md"
                                type="date" name="admissonDate">
                        </div>
                        <div class="relative group">
                            <label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">STUDENT
                                ID</label>
                            <input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-body-md"
                                placeholder="ID" type="text" name="id">
                        </div>
                        <div class="relative group">
                            <label
                                class="absolute -top-2 left-2 px-1 bg-surface-container-low text-[10px] font-bold text-on-surface-variant group-focus-within:text-primary transition-colors">ROLL NO
                                </label>
                            <input
                                class="w-full h-10 px-3 pt-1 rounded-lg border border-outline-variant bg-surface-container-lowest text-sm focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-body-md"
                                placeholder="Roll No" type="number" name="roll">
                        </div>
                    </div>
                </section>
        </div>
        
        <!-- Sticky Enrollment Button -->
        <div
            class="fixed bottom-20 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant/20 pb-7 px-9 pt-2 z-40 flex justify-center">
            <button
                class="w-full max-w-md bg-secondary text-on-secondary h-12 rounded-full font-bold shadow-lg flex items-center justify-center gap-2 transition-transform duration-200 active:scale-95 hover:bg-secondary/95">
                <span class="material-symbols-outlined">person_add</span>
                <span class="">Enroll Student</span>
            </button>
        </div>
</form>

    </main>
    <!-- Bottom Navigation Bar -->
     <div id="nav-container" class="fixed bottom-0 w-full z-50 mb-0 text-xs font-bold h-27 "></div>
    
 <script src="script/components/navbar.js"></script>
 <script src="script/students-enroll.js"></script>
</body>

</html>
